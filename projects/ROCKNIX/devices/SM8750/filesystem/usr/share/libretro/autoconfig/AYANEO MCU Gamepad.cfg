input_driver = "udev"
input_device = "AYANEO MCU Gamepad"
input_vendor_id = "0"
input_product_id = "0"

# Face buttons — udev enumerates present BTN_* in ascending evdev-code order:
# SOUTH=0 EAST=1 NORTH=2 WEST=3 TL=4 TR=5 TL2=6 TR2=7 SELECT=8 START=9
# MODE=10 THUMBL=11 THUMBR=12 (matches the in-tree retrogame_joypad layout).
input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "11"
input_r3_btn = "12"

# D-pad is an ABS hat (ABS_HAT0X/Y), not buttons.
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# Analog sticks — udev axis index = ascending ABS code among present axes:
# ABS_X=0 ABS_Y=1 ABS_Z=2 ABS_RX=3 ABS_RY=4 ABS_RZ=5 (HAT not counted).
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"

# Analog triggers: ABS_Z (left)=axis2, ABS_RZ (right)=axis5, rest at 0.
input_l2_axis = "+2"
input_r2_axis = "+5"

# Hotkeys — mirror the ROCKNIX retrogame defaults (enable = SELECT).
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "10"
input_load_state_btn = "4"
input_save_state_btn = "5"
input_state_slot_decrease_axis = "-0"
input_state_slot_increase_axis = "+0"
input_rewind_btn = "6"
input_toggle_fast_forward_btn = "7"
