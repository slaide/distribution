# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
version: 2
kind: CapabilityMap
name: KONKR System Buttons Mapping
id: konkr_sysbtn

# The konkr_sysbtn kernel serdev driver reads the AYANEO MCU UART and emits
# the 5 device "system" buttons as BTN_TRIGGER_HAPPY1..5. KONKR (id2) ->
# Guide; all other system buttons -> keyboard F-keys (bindable as hotkeys;
# gamepad-class targets beyond Guide don't exist on the xb360 target). The SPI
# gamepad's front-top-left BTN_MODE becomes F11 via konkr_gamepad.yaml.
mapping:
  - name: Front-bottom-right (KeyF12)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY1
          value_type: button
    target_event:
      keyboard: KeyF12

  - name: KONKR (Guide)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY2
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: Extra 3 (KeyF13)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY3
          value_type: button
    target_event:
      keyboard: KeyF13

  - name: Extra 4 (KeyF14)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY4
          value_type: button
    target_event:
      keyboard: KeyF14

  - name: Extra 5 (KeyF15)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY5
          value_type: button
    target_event:
      keyboard: KeyF15
