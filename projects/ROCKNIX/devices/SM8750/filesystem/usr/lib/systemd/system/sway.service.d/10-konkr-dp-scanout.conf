# SM8750/KONKR: the DPU cannot direct-scan-out a fullscreen client buffer to the
# DisplayPort plane — the atomic page-flip returns EBUSY, so a fullscreen
# toplevel (e.g. the konkr-launcher frontend) is black on an external DP display
# while a composited layer-shell overlay (the sidebar) shows fine. Force wlroots
# to composite instead of attempting direct scanout so fullscreen content
# presents on DP. Harmless on the internal DSI panel (composition works there).
[Service]
Environment=WLR_SCENE_DISABLE_DIRECT_SCANOUT=1
